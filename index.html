<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plants Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5fff5;
      color: #333;
    }
    header {
      background-color: #c8facc;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .menu-toggle {
      font-size: 28px;
      cursor: pointer;
      background: none;
      border: none;
      margin-right: 15px;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background-color: #e2ffe2;
      box-shadow: 2px 0 6px rgba(0,0,0,0.2);
      padding-top: 60px;
      transition: left 0.3s;
    }
    .sidebar.active {
      left: 0;
    }
    .sidebar a {
      display: block;
      padding: 15px 20px;
      color: #2e7d32;
      text-decoration: none;
      font-weight: 500;
    }
    .sidebar a:hover {
      background-color: #d3f9d8;
    }
    main {
      text-align: center;
      padding: 80px 20px;
    }
    main h1 {
      font-size: 2.5em;
      color: #4caf50;
    }
  </style>
</head>
<body>
  <header>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div class="title">Plants Store</div>
  </header>

  <div class="sidebar" id="sidebar">
    <a href="#flowers">Цветы</a>
    <a href="#boxes">Коробки</a>
    <a href="#baskets">Корзины</a>
    <a href="#potted">Горшочные цветы</a>
    <a href="#bouquets">Букеты</a>
  </div>

  <main>
    <h1>Магазин</h1>
  </main>

  <script>
    function toggleMenu() {
      document.getElementById('sidebar').classList.toggle('active');
    }
  </script>
</body>
</html>
