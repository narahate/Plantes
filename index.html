<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Цветочный магазин</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fffafc;
      color: #333;
    }
    header {
      background-color: #ffb6c1;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    header h1 {
      margin: 0;
      font-size: 2em;
    }
    nav {
      display: flex;
      justify-content: center;
      background-color: #ffe4e1;
      padding: 10px;
      flex-wrap: wrap;
    }
    nav a {
      margin: 10px;
      text-decoration: none;
      color: #d6336c;
      font-weight: 500;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #800020;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .product {
      background-color: #fff0f5;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 15px;
      text-align: center;
    }
    .product img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .product h3 {
      margin: 10px 0 5px;
    }
    .product p {
      margin: 0;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <h1>Цветочный магазин</h1>
  </header>
  <nav>
    <a href="#flowers">Цветы</a>
    <a href="#boxes">Коробки</a>
    <a href="#baskets">Корзины</a>
    <a href="#potted">Горшочные цветы</a>
    <a href="#bouquets">Букеты</a>
  </nav>
  <section class="products" id="flowers">
    <div class="product">
      <img src="https://via.placeholder.com/300x200?text=Розы" alt="Розы">
      <h3>Розы</h3>
      <p>Свежие красные розы</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300x200?text=Тюльпаны" alt="Тюльпаны">
      <h3>Тюльпаны</h3>
      <p>Весенние тюльпаны разных цветов</p>
    </div>
  </section>

  <section class="products" id="boxes">
    <div class="product">
      <img src="https://via.placeholder.com/300x200?text=Цветы+в+коробке" alt="Цветы в коробке">
      <h3>Цветы в коробке</h3>
      <p>Элегантная композиция</p>
    </div>
  </section>

  <section class="products" id="baskets">
    <div class="product">
      <img src="https://via.placeholder.com/300x200?text=Цветочная+корзина" alt="Цветочная корзина">
      <h3>Цветочная корзина</h3>
      <p>Удобный и стильный подарок</p>
    </div>
  </section>

  <section class="products" id="potted">
    <div class="product">
      <img src="https://via.placeholder.com/300x200?text=Горшок+с+орхидеей" alt="Горшок с орхидеей">
      <h3>Орхидея</h3>
      <p>Горшочная орхидея</p>
    </div>
  </section>

  <section class="products" id="bouquets">
    <div class="product">
      <img src="https://via.placeholder.com/300x200?text=Букет+микс" alt="Букет микс">
      <h3>Букет микс</h3>
      <p>Смешанный букет на любой случай</p>
    </div>
  </section>
</body>
</html>
