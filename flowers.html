<!-- flowers.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Цветы | Plants Store</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: white;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: gold;
      text-align: center;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .item {
      background-color: #1a1a1a;
      border: 1px solid gold;
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      padding: 10px;
      transition: transform 0.3s;
    }
    .item img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .item:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Цветы</h1>
  <div class="gallery">
    <div class="item">
      <!-- Instagram Embed -->
      <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/DIbwimMtfRF/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==" data-instgrm-version="14"></blockquote>
      <script async src="//www.instagram.com/embed.js"></script>
    </div>
  </div>
</body>
</html>
